map $upstream_http_x_content_type_options $edge_content_type_options {
    default nosniff;
    ~.+ "";
}

map $upstream_http_x_frame_options $edge_frame_options {
    default SAMEORIGIN;
    ~.+ "";
}

map $upstream_http_referrer_policy $edge_referrer_policy {
    default strict-origin-when-cross-origin;
    ~.+ "";
}

map $upstream_http_permissions_policy $edge_permissions_policy {
    default "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    ~.+ "";
}

map $upstream_http_strict_transport_security $edge_hsts {
    default "max-age=86400";
    ~.+ "";
}

server {
    listen 80;
    server_name mini.leadochat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mini.leadochat.com;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 128M;

    # Add only headers absent from the upstream response. This covers Nginx-served
    # static/errors without duplicating the Laravel middleware's own headers.
    add_header X-Content-Type-Options $edge_content_type_options always;
    add_header X-Frame-Options $edge_frame_options always;
    add_header Referrer-Policy $edge_referrer_policy always;
    add_header Permissions-Policy $edge_permissions_policy always;
    add_header Strict-Transport-Security $edge_hsts always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/storage/.*\.(?:php[0-9]?|phtml?|phar)(?:/|$) {
        return 404;
    }

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://reverb:8081;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 900s;
        fastcgi_read_timeout 900s;
    }

    location ~ /\.ht {
        deny all;
    }
}
