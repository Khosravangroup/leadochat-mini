services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: leadochat-mini-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - postgres
    networks:
      - leadochat-mini

  nginx:
    image: nginx:1.27-alpine
    container_name: leadochat-mini-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - leadochat-mini

  postgres:
    image: postgres:16-alpine
    container_name: leadochat-mini-postgres
    environment:
      POSTGRES_DB: leadochat_mini
      POSTGRES_USER: leadochat
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - leadochat-mini

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: leadochat-mini-reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
    ports:
      - "8081:8081"
    networks:
      - leadochat-mini

volumes:
  postgres_data:

networks:
  leadochat-mini:
    driver: bridge
