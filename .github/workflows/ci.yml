name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  php-sqlite:
    name: PHP / SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Prepare isolated test environment
        run: install -m 600 .env.example .env

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify committed Filament assets match Composer lock
        working-directory: .
        shell: bash
        run: |
          asset_paths=(src/public/css/filament src/public/fonts/filament src/public/js/filament)
          if ! git -c core.filemode=false diff --quiet -- "${asset_paths[@]}"; then
            echo "Filament assets differ after Composer installation." >&2
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- "${asset_paths[@]}")" ]]; then
            echo "Filament installation generated untracked assets." >&2
            exit 1
          fi

      - name: Validate PHP syntax
        run: >-
          find app bootstrap config database routes tests
          -type f -name '*.php' -print0 |
          xargs -0 -n1 php -l

      - name: Check formatting of changed PHP files
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi

          mapfile -d '' php_files < <(
            git diff --name-only -z --diff-filter=ACMRT \
              "$BASE_SHA" "$GITHUB_SHA" -- 'src/**/*.php'
          )

          if (( ${#php_files[@]} == 0 )); then
            echo "No changed PHP files require Pint validation."
            exit 0
          fi

          src/vendor/bin/pint --test "${php_files[@]}"

      - name: Run SQLite test suite
        run: php artisan test --display-warnings --colors=never

  php-postgresql:
    name: PHP / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    services:
      postgres:
        image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
        env:
          POSTGRES_DB: leadochat_test
          POSTGRES_USER: leadochat_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadochat_test -d leadochat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BCRYPT_ROUNDS: "4"
      BROADCAST_CONNECTION: "null"
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: leadochat_test
      DB_USERNAME: leadochat_test
      DB_PASSWORD: test-only-password
      DB_URL: ""
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Prepare isolated test environment
        run: install -m 600 .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PostgreSQL test suite
        run: php artisan test --display-warnings --colors=never

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Retain frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build-${{ github.sha }}
          path: src/public/build
          if-no-files-found: error
          retention-days: 7

  security:
    name: Secret and focused SAST scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Nginx static and error response headers
        run: bash scripts/ops/tests/test-nginx-response-headers.sh

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --redact --no-banner --exit-code 1 --log-opts=--all

      - name: Run focused Semgrep rules
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/src"
          --workdir /src
          semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
          semgrep scan --config .semgrep.yml --error --metrics=off
          --sarif --output semgrep.sarif

      - name: Upload Semgrep results to GitHub code scanning
        if: ${{ always() && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: semgrep.sarif
          category: leadochat-focused-semgrep

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Audit locked PHP dependencies
        run: composer audit --locked --abandoned=fail

      - name: Audit locked frontend dependencies
        if: always()
        run: npm audit --package-lock-only --audit-level=high
